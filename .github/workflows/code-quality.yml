name: code-quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ignore_cache:
        description: "Ignore the repository cache for this run"
        required: false
        default: "false"

jobs:
  dirty-waters:
    runs-on:
        ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup JDK17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build project
        # We need to build the agent first, because the tests depend on it
        run: mvn clean install -DskipTests

      - name: Dirty Waters Analysis
        uses: chains-project/dirty-waters-action@8260d3c8df017c2303e75d5559a59ba55e49a632
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: maven
          debug: true
          gradual_report: false
          config: dirty-waters.json
